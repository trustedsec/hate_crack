name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The containment check below needs origin/main and full history.
          fetch-depth: 0
          persist-credentials: false

      # Finals are only ever cut on main. A final-looking tag on a commit main
      # does not contain is a stray, not a release: refuse to publish it as one.
      # Candidates (vX.Y.ZrcN) live on nightly-dev and are exempt.
      - name: Refuse a final tag that main does not contain
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if ! git merge-base --is-ancestor "refs/tags/$GITHUB_REF_NAME" origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main; refusing to publish it as a release"
              exit 1
            fi
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, nothing to do"
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          else
            # Anything else (rcN, or an unexpected shape) must never become
            # "latest": tools ranking releases would offer it to users.
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --prerelease --latest=false
          fi
