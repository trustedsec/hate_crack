version: 2

updates:
  # Python dependencies (PEP 621 pyproject.toml + uv.lock).
  # The native "uv" ecosystem is used instead of "pip" because it reads
  # pyproject.toml and uv.lock directly (GA since 2025-03; security updates
  # since 2025-12).
  - package-ecosystem: "uv"
    directory: "/"
    # All PRs target nightly-dev; main receives work only via the batch
    # integration merge. Without this, Dependabot opens against the repo
    # default branch (main) and bypasses that cadence.
    target-branch: "nightly-dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # atomic-agents pins instructor==1.14.5 exactly and imports its internals
    # (instructor.core.client, instructor.processing.multimodal,
    # instructor.dsl.partial, instructor.processing.schema), all of which
    # 1.15.x reorganized. Bumping is unsatisfiable, and forcing it with an
    # override resolves but then fails at import with
    # "module 'instructor' has no attribute 'core'".
    #
    # REMOVE THIS as soon as atomic-agents relaxes the pin: check with
    #   curl -s https://pypi.org/pypi/atomic-agents/json \
    #     | python3 -c "import json,sys;print([r for r in json.load(sys.stdin)['info']['requires_dist'] if 'instructor' in r])"
    # Until then Dependabot would re-open the same unmergeable PR weekly.
    #
    # This entry has no versions/update-types qualifier, so it suppresses
    # ALL update types for instructor, including security updates, not just
    # routine version bumps. That is intentional and should not be narrowed
    # with update-types: the pin is exact (==1.14.5), so even a patch bump
    # is equally unsatisfiable and Dependabot would just open a different
    # unmergeable PR. The backstop for a vulnerable instructor is pip-audit,
    # which runs in .github/workflows/ci.yml and will fail CI if a flagged
    # version is ever resolved. If pip-audit flags instructor, fix it by
    # addressing the atomic-agents pin (upstream fix, or pinning around it)
    # — not by relaxing this ignore entry.
    #
    # openai 3.x is unreachable for the same reason, one level down:
    # instructor requires openai>=2.0.0,<3.0.0 — at 1.14.5 (the version
    # atomic-agents pins) and still at its own latest, 1.16.0. So a bump to
    # openai 3.x is unsatisfiable and `uv lock` fails outright rather than
    # resolving to something the suite could be run against. Dependabot has
    # proposed it four times (most recently #309, closed 2026-09-01).
    #
    # Only the MAJOR is ignored here, not the whole dependency: openai 2.x
    # patch and minor bumps resolve fine and should keep flowing, unlike the
    # instructor entry above where even a patch is unsatisfiable.
    #
    # REMOVE THIS when BOTH upstream conditions clear — checking only the
    # first is what makes this look fixed before it is:
    #   1. atomic-agents relaxes instructor==1.14.5 (see the check above), and
    #   2. the resulting instructor allows openai>=3:
    #        curl -s https://pypi.org/pypi/instructor/json \
    #          | python3 -c "import json,sys;print([r for r in json.load(sys.stdin)['info']['requires_dist'] if 'openai' in r])"
    ignore:
      - dependency-name: "instructor"
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
    # "chore" deliberately does NOT match the feat|fix|perf patterns in
    # .github/workflows/auto-tag.yml, so dependency PRs never auto-cut a tag.
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # GitHub Actions are SHA-pinned in .github/workflows; Dependabot keeps the
  # pins current (and refreshes the trailing "# vN" comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "nightly-dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # "chore(ci)" deliberately does NOT match the feat|fix|perf patterns in
    # .github/workflows/auto-tag.yml, so dependency PRs never auto-cut a tag.
    commit-message:
      prefix: "chore(ci)"
